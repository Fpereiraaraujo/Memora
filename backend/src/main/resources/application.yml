spring:
  application:
    name: memora-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/memora
    username: memora
    password: memora
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

memora:
  app:
    public-base-url: http://localhost:5173
  upload:
    max-file-size-bytes: 15728640
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/heic
      - image/heif
  security:
    jwt:
      secret: bWVtb3JhLWp3dC1zZWNyZXQtbWVtb3JhLWp3dC1zZWNyZXQ=
      expiration-minutes: 120
      issuer: memora
  storage:
    local-path: ./data/uploads
