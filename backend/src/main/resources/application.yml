spring:
  application:
    name: memora-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/memora
    username: memora
    password: memora
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-system}]"

memora:
  app:
    public-base-url: ${PUBLIC_APP_BASE_URL:http://localhost:5173}
    api-base-url: ${API_BASE_URL:http://localhost:8080}
    infinitepay-webhook-token: ${INFINITEPAY_WEBHOOK_TOKEN:memora-infinitepay-local-token}
  infinitepay:
    api-base-url: ${INFINITEPAY_API_BASE_URL:https://api.checkout.infinitepay.io}
    handle: ${INFINITEPAY_HANDLE:fernando-de-9n6}
    auth-header-name: ${INFINITEPAY_AUTH_HEADER_NAME:}
    auth-header-value: ${INFINITEPAY_AUTH_HEADER_VALUE:}
  upload:
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:20971520}
    requests-per-minute-per-ip: ${UPLOAD_REQUESTS_PER_MINUTE_PER_IP:10}
    likes-per-minute-per-ip: ${UPLOAD_LIKES_PER_MINUTE_PER_IP:30}
    max-files-per-request: ${UPLOAD_MAX_FILES_PER_REQUEST:5}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
  security:
    jwt:
      secret: ${JWT_SECRET:bWVtb3JhLWp3dC1zZWNyZXQtbWVtb3JhLWp3dC1zZWNyZXQ=}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
      issuer: ${JWT_ISSUER:memora}
    cors:
      allowed-origin-patterns:
        - http://localhost:*
        - http://127.0.0.1:*
        - https://localhost:*
        - https://127.0.0.1:*
        - https://*.vercel.app
        - https://*.sslip.io
        - https://*.ngrok-free.dev
        - https://memora.api.br
        - https://memora-site.com.br
        - https://www.memora-site.com.br
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
    bucket-name: ${STORAGE_BUCKET_NAME:}
    region: ${STORAGE_REGION:us-east-1}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
