spring:
  datasource:
    url: jdbc:h2:mem:memora;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

memora:
  app:
    public-base-url: http://localhost:5173
  security:
    jwt:
      secret: bWVtb3JhLWp3dC1zZWNyZXQtbWVtb3JhLWp3dC1zZWNyZXQ=
      expiration-minutes: 120
      issuer: memora
  storage:
    local-path: ./data/uploads-test
